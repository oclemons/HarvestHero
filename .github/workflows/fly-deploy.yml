name: Fly.io deploy

# Auto-deploys the web app to Fly.io on every push to main that touches
# something the web app cares about. The paths filter keeps unrelated
# changes (installer stuff, docs) from spinning up a deploy for nothing.
#
# Structure: security -> tests -> deploy. Any of those failing blocks
# the deploy, so a bad commit never lands in production.
#
# One-time setup on the maintainer's side (still required for deploy):
#
#   1. Generate a deploy token scoped to just this app:
#        flyctl tokens create deploy \
#            --name "github-actions-deploy" \
#            --app harvest-hero-pantry
#
#   2. Copy the token (starts with "FlyV1 "), then add it as a repo
#      secret at Settings -> Secrets and variables -> Actions ->
#      New repository secret, name = FLY_API_TOKEN.
#
# After that, `git push origin main` runs security + tests, then
# deploys automatically. Watch progress in the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "database.py"
      - "auth.py"
      - "paths.py"
      - ".github/workflows/fly-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "database.py"
      - "auth.py"
      - "paths.py"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm a manual deploy"
        required: true
        default: ""

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── security-scan ─────────────────────────────────────────
  # pip-audit checks every runtime dependency for known CVEs.
  # check_secrets.py greps tracked files for hard-coded tokens
  # (Fly, AWS, GitHub, PEM keys, etc.). Either failing blocks
  # the whole workflow.
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install --quiet pip-audit

      - name: pip-audit (web dependencies)
        run: |
          pip-audit \
              --requirement web/requirements.txt \
              --strict

      - name: Secrets scan (tracked files)
        run: python3 web/tools/check_secrets.py

  # ── tests ──────────────────────────────────────────────────
  # The full flask-test-client suite. Runs in parallel with the
  # security job; both must pass before deploy.
  tests:
    name: Web app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: pip install --quiet -r web/requirements.txt

      - name: Run unit tests
        working-directory: web
        env:
          HARVESTHERO_DEV_DIR: /tmp/hh_ci_test
          HARVESTHERO_SECRET_KEY: ci-secret-abcdefghijklmnopqrstuvwx
          HARVESTHERO_COOKIE_SECURE: "0"
        run: python -m unittest discover -s tests -v

  # ── deploy ─────────────────────────────────────────────────
  # Only runs on push to main (not PRs) AND only after both
  # security + tests are green.
  deploy:
    name: Deploy web app
    runs-on: ubuntu-latest
    needs: [security, tests]
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.confirm == 'deploy')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds the Docker image on Fly's builder,
      # not on the GitHub runner. Saves ~5 min of runner time.
      - name: Deploy
        run: |
          flyctl deploy \
              --config web/fly.toml \
              --dockerfile web/Dockerfile \
              --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
