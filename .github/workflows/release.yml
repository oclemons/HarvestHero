name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this Release
          
          See commit history for details.
          
          ### Installation
          
          1. Download the latest release zip file
          2. Extract to your Harvest Hero directory
          3. The app will automatically detect and install the update on next launch
          
          ### Update Process
          
          The application will automatically check for updates on startup and notify you if a new version is available. Simply click "Install Update" to download and apply the update automatically.
        draft: false
        prerelease: false
    
    - name: Create Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./
        asset_name: HarvestHero-${{ github.ref_name }}.zip
        asset_content_type: application/zip
