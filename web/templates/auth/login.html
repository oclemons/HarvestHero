{% extends "base.html" %}
{% block title %}Sign in &middot; Harvest Hero{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
  <div class="bg-white shadow-lg rounded-lg p-8">
    <h1 class="text-2xl font-bold text-emerald-800 mb-1">Harvest Hero</h1>
    <p class="text-sm text-slate-500 mb-6">Sign in to manage your pantry.</p>

    <form method="post" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">
          Username
        </label>
        <input id="username" name="username" required autocomplete="username"
               autofocus
               class="w-full rounded border border-slate-300 px-3 py-2
                      focus:outline-none focus:ring-2 focus:ring-emerald-600">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
          Password
        </label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password"
               class="w-full rounded border border-slate-300 px-3 py-2
                      focus:outline-none focus:ring-2 focus:ring-emerald-600">
      </div>

      <button type="submit"
              class="w-full bg-emerald-700 text-white font-semibold py-2 rounded
                     hover:bg-emerald-800 transition">
        Sign in
      </button>
    </form>
  </div>

  <p class="text-xs text-slate-500 text-center mt-4">
    Trouble signing in? Contact your pantry administrator.
  </p>
</div>
{% endblock %}
