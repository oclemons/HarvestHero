{% extends "base.html" %}
{% block title %}{{ title }} &middot; Harvest Hero{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-16 text-center">
  <div class="text-6xl font-bold text-slate-400 mb-2">{{ code }}</div>
  <h1 class="text-2xl font-bold text-slate-900 mb-3">{{ title }}</h1>
  <p class="text-slate-600 mb-8">{{ message }}</p>

  <a href="{{ url_for('dashboard.home') if current_user.is_authenticated
                                        else url_for('auth.login') }}"
     class="inline-block bg-emerald-700 text-white font-semibold px-5 py-2
            rounded hover:bg-emerald-800 transition">
    Back to {{ 'Dashboard' if current_user.is_authenticated else 'Sign in' }}
  </a>
</div>
{% endblock %}
